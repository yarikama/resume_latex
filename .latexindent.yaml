# latexindent configuration (v4 field names; 0/1 switches are integers, not booleans)

indentPreamble: 1
defaultIndent: "  "
onlyOneBackUp: 1

removeTrailingWhitespace:
  beforeProcessing: 1
  afterProcessing: 1

lookForAlignDelims:
  tabular:
    delims: 1
    alignDoubleBackSlash: 1
    spacesBeforeDoubleBackSlash: 1
  tabularx:
    delims: 1

# Only takes effect when latexindent is run with -m.
modifyLineBreaks:
  textWrapOptions:
    columns: 100
    when: after

verbatimEnvironments:
  verbatim: 1
  lstlisting: 1
  minted: 1
  comment: 1
verbatimCommands:
  verb: 1
  lstinline: 1
